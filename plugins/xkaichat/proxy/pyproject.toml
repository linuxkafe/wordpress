[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "xkaichat-proxy"
version = "1.0.0"
description = "XKaiChat Proxy - Intermediate FastAPI service for Ollama with RAG and caching"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
    "pypdf>=5.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0",
]

[tool.setuptools]
py-modules = [
    "normalize",
    "cache",
    "config",
    "rag",
    "proxy",
    "main",
    "index_pdfs",
]

[tool.setuptools.packages.find]
where = ["."]
exclude = ["cache_store*", "index*", "pdfs*", "venv*", "__pycache__*", "*.egg-info*"]